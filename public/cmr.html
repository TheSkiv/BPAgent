<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMR register · PortSystem</title>
  <link rel="stylesheet" href="/ui.css" />
  <script src="/i18n.js"></script>
  <style>
    .reg-main { max-width: 1080px; margin: 0 auto; padding: 18px 20px 60px; }
    .reg-main > section { padding: 16px 18px; }
    .reg-main h2 { font: 700 22px var(--display); margin-bottom: 2px; }
    .hint { font-size: 13px; color: var(--steel); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    td, th { padding: 7px 6px; border-top: 1px solid var(--hair-2); text-align: left; vertical-align: middle; }
    th { font-weight: 600; color: var(--steel); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; border-top: 0; }
    td.mono { font-family: var(--mono); white-space: nowrap; }
    td.num { text-align: right; white-space: nowrap; }
    #filter { max-width: 320px; margin-top: 10px; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">Truck desk <small>BPA · PortSystem</small></div>
  <nav><a href="/">Trucks</a><a href="/lots.html" data-i18n="nav.lots">Lots &amp; owners</a><a href="/cmr.html" class="on" data-i18n="nav.cmr">CMR register</a><a href="/log.html" data-i18n="nav.log">Truck log</a></nav>
  <div class="spacer"></div>
</header>
<main class="reg-main">
  <section class="card">
    <h2>CMR register</h2>
    <p class="hint">Every CMR PortSystem has printed, newest first. Make a new one from a truck's window (the CMR button).</p>
    <input id="filter" type="search" placeholder="Find — number, plate, consignee" autocomplete="off" />
    <table>
      <thead><tr><th>Number</th><th>Printed</th><th>Plates</th><th>Consignee</th><th>Place of delivery</th><th>Goods</th><th class="num">Gross, kg</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="hint">Loading…</td></tr></tbody>
    </table>
  </section>
</main>
<script>
  I18N.translatePage();
  const t = I18N.t;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let all = [];
  function render() {
    const q = document.getElementById('filter').value.trim().toLowerCase().replace(/[\s/]+/g, '');
    const list = all.filter(r => !q || [r.number, r.plate, r.consignee, r.delivery].join(' ').toLowerCase().replace(/[\s/]+/g, '').includes(q));
    document.getElementById('rows').innerHTML = list.length ? list.map(r => `<tr>
      <td class="mono">${esc(r.number)}</td>
      <td>${esc(new Date(r.at).toLocaleString('lt-LT', { dateStyle: 'short', timeStyle: 'short' }))}</td>
      <td class="mono">${esc(r.plate)}</td><td>${esc(r.consignee)}</td><td>${esc(r.delivery)}</td><td>${esc(r.goods)}</td>
      <td class="num">${esc(r.grossKg)}</td>
      <td><a class="btn small" target="_blank" rel="noopener" href="/cmr/pdf?number=${encodeURIComponent(r.number)}">${t('Print again')}</a></td></tr>`).join('')
      : `<tr><td colspan="8" class="hint">${t(all.length ? 'Nothing matches.' : 'No CMR printed yet.')}</td></tr>`;
  }
  document.getElementById('filter').addEventListener('input', render);
  fetch('/cmr/register').then(r => r.json()).then(d => { all = d.cmrs || []; render(); });
</script>
</body>
</html>
